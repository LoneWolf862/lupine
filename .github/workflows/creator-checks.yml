name: Creator checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check independent Rust consumer
        run: cargo check --locked --manifest-path samples/independent_game/Cargo.toml --target-dir target/independent-consumer
      - name: Check offline documentation
        run: python scripts/check_docs.py
      - run: cargo build --locked --release
      - run: python scripts/phase4_acceptance.py
      - name: Linux interactive history acceptance
        if: runner.os == 'Linux'
        run: python scripts/history_pty_check.py
      - name: Verify portable package and release archive
        run: python scripts/package_development.py --release
      - name: Complete packaged mini adventure and export
        run: python scripts/mini_adventure_acceptance.py
      - name: Retain acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}
          path: |
            target/phase4-acceptance-*/*.txt
            target/phase4-acceptance-*/summary.json
            target/history-pty-transcript.bin
            target/mini-pty-transcript.bin
            target/mini-package-acceptance-*/*.txt
            target/mini-package-acceptance-*/summary.json
          if-no-files-found: warn
          retention-days: 14

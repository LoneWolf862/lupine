name: Lupine portable builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify and build
        shell: pwsh
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo check --locked --manifest-path samples/independent_game/Cargo.toml --target-dir target/independent-consumer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check offline documentation
        run: python scripts/check_docs.py
      - name: Native exported-package acceptance
        shell: pwsh
        run: python scripts/phase4_acceptance.py
      - name: Linux interactive history acceptance
        if: runner.os == 'Linux'
        run: python3 scripts/history_pty_check.py
      - name: Package native development runtime and examples
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $result = python scripts/package_development.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $package = $result | ConvertFrom-Json
          "name=$($package.name)" >> $env:GITHUB_OUTPUT
          "path=$($package.path)" >> $env:GITHUB_OUTPUT
      - name: Complete packaged mini adventure and export
        run: python scripts/mini_adventure_acceptance.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.path }}/
          if-no-files-found: error
          retention-days: 14
      - name: Retain acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-verification-${{ matrix.platform }}
          path: |
            target/phase4-acceptance-*/*.txt
            target/phase4-acceptance-*/summary.json
            target/history-pty-transcript.bin
            target/mini-package-acceptance-*/*.txt
            target/mini-package-acceptance-*/summary.json
          if-no-files-found: warn
          retention-days: 14

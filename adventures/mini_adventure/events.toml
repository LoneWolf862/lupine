[[events]]
id="arrival"
on={enter="camp"}
effects=[{set_quest_stage={quest="challenge",stage="prepare"}},{add_journal="route"},{start_timer="reminder"}]
text="""
================
 Mini Adventure
================

Open the eastern gate and defeat the stone golem.
Start with talk to guide. Read journal or help whenever you need it.
"""
[[events]]
id="goblin_defeated"
on={defeat="goblin"}
effects=[{set_quest_stage={quest="challenge",stage="chest"}}]
text="""
The goblin drops a trophy and three coins.
Take trophy; search stump and take chest key. Journal has the route.
"""
[[events]]
id="key_found"
on="turn"
requires=[{has_item="brass_key"},{flag_unset="gate_open"}]
effects=[{set_quest_stage={quest="challenge",stage="gate"}}]
[[events]]
id="gate_unlocked"
on="turn"
requires=[{flag_set="gate_open"}]
effects=[{set_quest_stage={quest="challenge",stage="boss"}}]
[[events]]
id="focus"
on={enter="workshop"}
effects=[{apply_status="focus"}]
text="""
Preparation gives you Focus. Status shows its remaining duration.
Use mana altar for free rest and to refresh Focus before the golem.
"""
[[events]]
id="reminder"
on={timer="reminder"}
effects=[{add_journal="save_hint"}]
text="""
Reminder: save NAME keeps progress only when you ask.
Journal contains the route. There is no deadline.
"""
[[events]]
id="victory"
on={defeat="stone_golem"}
effects=[{set_quest_stage={quest="challenge",stage="done"}},{end_game="victory"}]
[timers.reminder]
turns=6
[quests.challenge]
title="Current objective: complete the mini adventure"
[quests.challenge.stages]
prepare="""
Talk to the guide. Take the dagger and scrolls; learn each scroll.
Go south and defeat the goblin. Take its trophy and search the stump
for the chest key.
"""
chest="""
Take the trophy and chest key. Return north to camp.
Unlock the western shop; sell trophy and optionally buy sword.

Visit the storeroom north of camp. If it is dark, return south and
ask the guide about the chest. Cast light on lamp costs one coin.
Unlock and open the chest; take the brass key and supplies.
"""
gate="""
Equip padded coat. Return south to camp, then east to the gate.
Use the brass key to unlock it, then continue east to the workshop.
"""
boss="""
The gate is open. Use mana altar in the workshop to restore HP and MP
and refresh Focus. Go east to the approach and save NAME if desired.
Go east once more to defeat the stone golem.
"""
done="You defeated the stone golem and completed the adventure."
[journal.route]
title="Route and commands"
text="""
Preparation
Talk to guide. Enter your name, then L leaves the conversation.
Take dagger and take all scrolls. Learn fireball scroll and
learn healing scroll. Spellbook lists known abilities and costs.

Woods and shop
Go south. Attack goblin with dagger or cast fireball at goblin.
Take trophy, search stump, and take chest key. Return north.
Use shop key on door; go west. Sell trophy and optionally buy sword.
The shop key stays in the lock. Go east to return to camp.

Storeroom
Go north. If you cannot find the chest, return south and talk guide;
choose chest for help, then L to leave. Return north.
Cast light on lamp. Unlock chest with chest key; open chest.
The chest key stays in its lock. Take all collects the supplies.
Equip padded coat. Eat ration uses one ration to restore up to 15 HP.

Gate and workshop
Return south to camp, then east. Accept the brass-key prompt, or
unlock gate with brass key. Go east; use mana altar for free rest.
The altar also refreshes Focus for several actions.

Final challenge
Go east to the quiet approach. Save before-boss if you wish.
Go east again. Attack stone golem with steel sword or cast fireball
at golem. The dagger also works. Retreat west twice to rest;
a living golem retains its wounds. Neither enemy respawns.
"""
[journal.save_hint]
title="Manual saving"
text="""
Save NAME creates a manual checkpoint; load NAME restores it.
Your name, inventory, coins and world progress are included.
Nothing autosaves, including when quitting.
"""
[endings.victory]
kind="success"
text="""
The stone golem settles into stillness. Mini adventure complete!

You can inspect your inventory, read journal, check stats, or save NAME.
Quit returns to startup.
"""
